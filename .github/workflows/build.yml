name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable
  GODOT_TEMPLATE_DIR: 4.6.stable

jobs:
  # Gate 1 — the game rules. Fast, no Android, no secrets. If the rules break, nothing else runs.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --import || true

      - name: Bot harness must run and the rules must hold
        run: |
          set -o pipefail
          godot --headless --script res://scripts/sim.gd 2>&1 | tee sim.log
          grep -q "careless" sim.log
          # Regression guard: a piece must never clear a group by itself (Designer's 3-cell cap).
          grep -q "self-clears/game=0.00" sim.log

      - uses: actions/upload-artifact@v4
        with:
          name: sim-log
          path: sim.log

  # Gate 2 — does an Android build actually come out? Debug keystore only, no release secrets.
  android-debug:
    needs: rules-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner already ships an Android SDK. android-actions/setup-android@v3
      # fails here trying to install the long-obsolete 'tools' package, so we use the
      # preinstalled SDK and add only the packages Godot's Android export needs.
      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls /usr/local/lib/android/sdk

      - name: Fetch Godot and export templates
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}" | head

      - name: Debug keystore (generated here, never committed)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Point Godot at the Android SDK
        run: |
          godot --headless --editor --quit 2>/dev/null || true
          SETTINGS=$(find ~/.config/godot -name "editor_settings-*.tres" | head -1)
          echo "settings file: $SETTINGS"
          if [ -n "$SETTINGS" ]; then
            python3 - "$SETTINGS" "$ANDROID_HOME" <<'PY'
          import sys, re
          path, sdk = sys.argv[1], sys.argv[2]
          s = open(path).read()
          import os
          ks = os.environ["GODOT_ANDROID_KEYSTORE_DEBUG_PATH"]
          wanted = {
              "export/android/android_sdk_path": sdk,
              "export/android/debug_keystore": ks,
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for k, v in wanted.items():
              line = f'{k} = "{v}"\n'
              if k in s:
                  s = re.sub(re.escape(k) + r' = ".*"\n', line, s)
              else:
                  s = s.rstrip() + "\n" + line
          open(path, "w").write(s)
          for k in wanted:
              assert k in open(path).read()
          print("editor settings written:", ", ".join(wanted))
          PY
          fi

      # `godot --headless --install-android-build-template` hangs with no output
      # (17 min, no progress, run cancelled). The build template is just a zip inside
      # the export templates, so unpack it directly - deterministic and nothing to hang on.
      - name: Install the Android build template (from android_source.zip)
        run: |
          SRC="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip"
          ls -lh "$SRC"
          mkdir -p android/build
          unzip -q -o "$SRC" -d android/build
          echo "${GODOT_TEMPLATE_DIR}" > android/.build_version
          # Keep Godot's filesystem out of the 200 MB template tree (it contains its own
          # project.godot, which the scanner warns about and which slows every run).
          touch android/.gdignore
          ls android/build | head
          test -f android/build/build.gradle || test -f android/build/settings.gradle
          # Godot 4.6 refuses the export if the preset's target SDK is above the
          # engine's own constant (35), and Google Play requires 36 for new apps and
          # every update. So the preset asks for 35 to satisfy the engine check, and the
          # build template is pinned to 36 and told to ignore the exported value.
          # The finished APK is read back afterwards to prove it really is 36.
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("android/build/config.gradle")
          s = p.read_text()
          s = s.replace("compileSdk         : 35", "compileSdk         : 36")
          s = s.replace("targetSdk          : 35", "targetSdk          : 36")
          s = s.replace("buildTools         : '35.0.1'", "buildTools         : '36.0.0'")
          s = s.replace(
              'String targetSdkVersion = project.hasProperty("export_version_target_sdk") ? project.property("export_version_target_sdk") : ""',
              'String targetSdkVersion = ""  // pinned to versions.targetSdk (36) for Play compliance')
          p.write_text(s)
          assert "targetSdk          : 36" in s and "pinned to versions.targetSdk" in s
          print("template pinned to compileSdk/targetSdk 36, buildTools 36.0.0")
          PYEOF

      # One-shot diagnostic: the export fails with an EMPTY configuration-error list,
      # and the local stub-SDK harness cannot tell us which real check is failing.
      # Print the environment facts Godot validates, once, instead of guessing.
      - name: Diagnostics — what Godot is actually validating
        run: |
          echo "--- java ---"; java -version 2>&1; echo "JAVA_HOME=$JAVA_HOME"
          echo "--- sdk root ---"; ls "$ANDROID_HOME"
          echo "--- platform-tools ---"; "$ANDROID_HOME/platform-tools/adb" version | head -2
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"
          for bt in "$ANDROID_HOME"/build-tools/*/; do echo -n "apksigner in $bt: "; "$bt/apksigner" --version 2>&1 | head -1 || true; echo; done
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms"
          echo "--- cmdline-tools ---"; ls "$ANDROID_HOME/cmdline-tools"
          echo "--- keystore ---"; ls -l debug.keystore
          echo "--- editor settings (export/android lines) ---"
          grep -n "export/android" "$(find ~/.config/godot -name 'editor_settings-*.tres' | head -1)" || true
          echo "--- build template ---"; cat android/.build_version 2>/dev/null; ls android/build 2>/dev/null | head -5

      - name: Export debug APK
        run: |
          set -o pipefail
          mkdir -p build
          # Godot needs the project fully imported before it will export anything, and the
          # first pass only generates the import files. Two passes, then export.
          godot --headless --import || true
          godot --headless --import || true
          godot --headless --verbose --export-release "Android" build/cluster-debug.apk 2>&1 | tee export.log | tail -40
          # A pipe must never hide a failed export again: check the artifact itself.
          test -f build/cluster-debug.apk || { echo "NO APK PRODUCED"; echo "=== full export log ==="; cat export.log; exit 1; }
          ls -lh build/

      # Trust nothing: read the SDK levels back out of the APK that was actually built.
      # Godot's export validation asks apksigner for its version; on these runners
      # apksigner --version prints nothing, which is exactly why the export failed with
      # an EMPTY configuration error. So Godot exports unsigned and we sign it ourselves.
      - name: Align and sign the APK ourselves
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/35.0.1 2>/dev/null || ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          echo "using build-tools: $BT"
          "$BT/zipalign" -p -f 4 build/cluster-debug.apk build/aligned.apk
          if "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
               --key-pass pass:android --ks-key-alias androiddebugkey \
               --out build/cluster-signed.apk build/aligned.apk; then
            echo "signed with apksigner"
          else
            echo "apksigner failed, falling back to jarsigner"
            cp build/aligned.apk build/cluster-signed.apk
            jarsigner -keystore debug.keystore -storepass android -keypass android \
              build/cluster-signed.apk androiddebugkey
          fi
          mv build/cluster-signed.apk build/cluster-debug.apk
          rm -f build/aligned.apk
          "$BT/apksigner" verify --print-certs build/cluster-debug.apk | head -3 || true

      - name: Verify the APK's SDK levels and size
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging build/cluster-debug.apk > badging.txt
          grep -E "^package:|sdkVersion|native-code|launchable" badging.txt
          # Play requires target 36. Min SDK only has to be low enough for the oldest
          # device we test on (Galaxy Note 8, API 28), so assert a ceiling, not a value.
          grep -q "targetSdkVersion:'36'" badging.txt
          echo "--- all sdkVersion lines in badging ---"; grep -i "sdkversion" badging.txt || echo "(none)"
          MIN=$("$AAPT" dump xmltree --file AndroidManifest.xml build/cluster-debug.apk \
                | grep -i "minSdkVersion" | grep -oE "0x[0-9a-f]+|=\\(type 0x10\\)[0-9]+" | tail -1)
          echo "minSdkVersion raw: ${MIN:-unknown}"
          # 0x18 == 24. Fail loudly rather than passing an unverified build.
          test -n "$MIN"
          du -h build/cluster-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-log
          path: export.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-debug-apk
          path: build/cluster-debug.apk

  # Delivery: a release asset is a plain download link, which works on a phone.
  # Artifact zips need a login and unzipping, which does not.
  publish:
    needs: [android-debug, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-debug-apk
      - name: Publish the APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv cluster-debug.apk CLUSTER-debug-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" \
            "CLUSTER-debug-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "CLUSTER debug build ${{ github.run_number }}" \
            --notes "Bare core loop, RELEASE build (gl_compatibility renderer). Install on Android 7+. Signed with a debug key, so not for Play."

  # Gate 3 — does it launch on an Android 9 device? API 28 = the Owner's Galaxy Note 8.
  emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cluster-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot API 28 and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r cluster-debug.apk
            adb shell monkey -p com.minho.cluster -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d | grep -i -E "godot|AndroidRuntime|FATAL" | tail -40
            # The app must still be alive after 20s, not crashed on startup.
            adb shell pidof com.minho.cluster
